<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand" href="dashboard.html">
      <img src="images/logo.svg" alt="ФинУчет" height="36" style="vertical-align: middle;">
    </a>
    
    <!-- Мобильная версия: имя + выход -->
    <div class="d-flex align-items-center gap-2 d-lg-none" id="mobileUserInfo">
      <select id="currencySelectMobile" class="form-select form-select-sm" style="width: auto;">
        <option value="RUB">₽ RUB</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
        <option value="KZT">₸ KZT</option>
        <option value="BYN">Br BYN</option>
        <option value="UAH">₴ UAH</option>
      </select>
      <span class="text-muted" style="font-size: 12px; white-space: nowrap;">
        👤 <span id="navUsernameMobile"></span>
      </span>
      <a class="btn btn-outline-secondary btn-sm" href="#" id="logoutBtnMobile" style="font-size: 11px; padding: 2px 6px;">Выйти</a>
    </div>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="dashboard.html">
            <img src="images/dashboard.svg" alt="Дашборд" width="18" height="18">
            Дашборд
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="transactions.html">
            <img src="images/transactions.svg" alt="Операции" width="18" height="18">
            Операции
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="plans.html">
            <img src="images/plans.svg" alt="Планы трат" width="18" height="18">
            Планы трат
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="reports.html">
            <img src="images/reports.svg" alt="Отчеты" width="18" height="18">
            Отчеты
          </a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item d-flex align-items-center me-3 text-muted">
          <span>👤 <span id="navUsername"></span></span>
        </li>
        <li class="nav-item">
          <a class="btn btn-outline-secondary btn-sm" href="#" id="logoutBtn">Выйти</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 mb-0">Отчеты и аналитика</h1>
    <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#exportModal">📥 Скачать отчет (Excel)</button>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-lg-5">
      <div class="card p-3 h-100">
        <h2 class="h6 mb-3">Расходы по категориям (текущий месяц)</h2>
        <canvas id="categoryPie" height="280"></canvas>
        <div id="pieEmpty" class="empty-state d-none">Нет расходов за текущий месяц.</div>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="card p-3 h-100">
        <h2 class="h6 mb-3">Доходы и расходы за последние 30 дней</h2>
        <canvas id="trendChart" height="480"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Export modal -->
<div class="modal fade" id="exportModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Скачать отчет за период</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Начальная дата</label>
          <input type="date" class="form-control" id="exportStart">
        </div>
        <div class="mb-3">
          <label class="form-label">Конечная дата</label>
          <input type="date" class="form-control" id="exportEnd">
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="exportExpensesOnly">
          <label class="form-check-label" for="exportExpensesOnly">
            Только расходы (по умолчанию — все операции)
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-brand" id="doExportBtn">Скачать</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
