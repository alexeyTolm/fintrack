<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Личный финансовый учет — Вход</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="card auth-card p-4 p-md-5">
    <!-- Логотип -->
    <div class="text-center mb-3">
      <img src="images/logo.svg" alt="ФинУчет" height="50" class="d-block" style="margin: 0 auto 0 calc(50% + 15px); transform: translateX(-50%);">
    </div>
    
    <h1 class="h4 text-center mb-1" style="font-weight: 700; color: #1f2937;">Добро пожаловать</h1>
    <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">Войдите или создайте аккаунт</p>

    <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
      <li class="nav-item">
        <button class="nav-link active" data-tab="login">Вход</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-tab="register">Регистрация</button>
      </li>
    </ul>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <!-- LOGIN -->
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Пароль</label>
        <input type="password" class="form-control form-control-lg" id="loginPassword" placeholder="Введите пароль" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 btn-lg">Войти</button>
      <p class="text-center text-muted mt-3 mb-0" style="font-size: 0.85rem;">
        <a href="forgot-password.html" style="color: var(--brand); text-decoration: none;">Забыли пароль?</a>
      </p>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="d-none">
      <div class="mb-3">
        <label class="form-label fw-semibold">Имя пользователя</label>
        <input type="text" class="form-control form-control-lg" id="regUsername" placeholder="Ваше имя" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control form-control-lg" id="regEmail" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Пароль</label>
        <input type="password" class="form-control form-control-lg" id="regPassword" placeholder="Минимум 6 символов" minlength="6" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Подтверждение пароля</label>
        <input type="password" class="form-control form-control-lg" id="regPasswordConfirm" placeholder="Повторите пароль" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 btn-lg">Зарегистрироваться</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
