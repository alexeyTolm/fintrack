<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Подтверждение — ФинУчет</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="card auth-card p-4 p-md-5">
    <!-- Логотип -->
    <div class="text-center mb-3">
      <img src="images/logo.svg" alt="ФинУчет" height="50" class="d-block" style="margin: 0 auto; position: relative; left: 10px;">
    </div>
    
    <h1 class="h4 text-center mb-1" style="font-weight: 700; color: #1f2937;">Подтверждение</h1>
    <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">
      Мы отправили код на <span id="verifyEmail" style="font-weight: 600;">ваш email</span>
    </p>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
    <div id="successBox" class="alert alert-success d-none" role="alert"></div>

    <form id="verifyForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Введите код из письма</label>
        <input type="text" class="form-control form-control-lg text-center" id="verifyCode" placeholder="000000" maxlength="6" style="font-size: 28px; letter-spacing: 8px; font-weight: 700;" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 btn-lg" id="verifyBtn">Подтвердить</button>
    </form>

    <div class="text-center mt-3">
      <p class="text-muted" style="font-size: 0.85rem;">
        Не пришёл код? 
        <a href="#" id="resendCodeBtn" style="color: var(--brand); text-decoration: none; font-weight: 600;">Отправить снова</a>
      </p>
      <p class="text-muted" style="font-size: 0.8rem;">
        <a href="index.html" style="color: var(--brand); text-decoration: none;">← Вернуться ко входу</a>
      </p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
