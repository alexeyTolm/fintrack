<div class="container pb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 mb-0">Операции</h1>
    <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#txModal" id="btnAddTx">+ Добавить операцию</button>
  </div>

  <div id="alertBox" class="alert alert-danger d-none"></div>

  <!-- Filters -->
  <div class="card p-3 mb-4">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Тип</label>
        <select class="form-select form-select-sm" id="filterType">
          <option value="">Все</option>
          <option value="income">Доход</option>
          <option value="expense">Расход</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small mb-1">Категория</label>
        <select class="form-select form-select-sm" id="filterCategory">
          <option value="">Все</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Период</label>
        <select class="form-select form-select-sm" id="filterPeriod">
          <option value="all">Все время</option>
          <option value="today">Сегодня</option>
          <option value="week">Неделя</option>
          <option value="month">Месяц</option>
          <option value="custom">Произвольный</option>
        </select>
      </div>
      <div class="col-6 col-md-2 custom-range d-none">
        <label class="form-label small mb-1">С</label>
        <input type="date" class="form-control form-control-sm" id="filterStart">
      </div>
      <div class="col-6 col-md-2 custom-range d-none">
        <label class="form-label small mb-1">По</label>
        <input type="date" class="form-control form-control-sm" id="filterEnd">
      </div>
      <div class="col-6 col-md-1">
        <button class="btn btn-brand btn-sm w-100" id="btnFilter">Найти</button>
      </div>
    </div>
  </div>

  <div class="card p-3">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead>
        <tr>
          <th>Дата</th>
          <th>Тип</th>
          <th>Категория</th>
          <th class="text-end">Сумма</th>
          <th>Комментарий</th>
          <th class="text-end">Действия</th>
        </tr>
      </thead>
      <tbody id="txBody"></tbody>
    </table>
    <div id="txEmpty" class="empty-state d-none">Операций не найдено.</div>
  </div>
</div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="txModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="txModalTitle">Новая операция</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="txForm">
        <div class="modal-body">
          <input type="hidden" id="txId">
          <div class="mb-3">
            <label class="form-label">Тип</label>
            <select class="form-select" id="txType" required>
              <option value="expense">Расход</option>
              <option value="income">Доход</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Категория</label>
            <select class="form-select" id="txCategory" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Сумма</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="txAmount" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Дата</label>
            <input type="date" class="form-control" id="txDate" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <input type="text" class="form-control" id="txComment" placeholder="Необязательно">
          </div>

          <!-- ===== НОВЫЙ ЧЕКБОКС ===== -->
          <div class="mb-3" id="excludeCheckboxWrapper">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="txExcludeFromIncome">
              <label class="form-check-label" for="txExcludeFromIncome">
                <span>Не учитывать в доходах</span>
                <small class="d-block text-muted" style="font-size: 0.75rem;">
                  (для возвратов, переводов между счетами, покупки/продажи активов)
                </small>
              </label>
            </div>
          </div>
          <!-- ===== КОНЕЦ НОВОГО ЧЕКБОКСА ===== -->

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-brand">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Удалить операцию?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">Это действие нельзя отменить.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Удалить</button>
      </div>
    </div>
  </div>
</div>
