<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Сброс пароля — ФинУчет</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="card auth-card p-4 p-md-5">
    <!-- Логотип -->
    <div class="text-center mb-3">
      <img src="images/logo.svg" alt="ФинУчет" height="50" class="d-block" style="margin: 0 auto; position: relative; left: 10px;">
    </div>
    
    <h1 class="h4 text-center mb-1" style="font-weight: 700; color: #1f2937;">Сброс пароля</h1>
    <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">
      Введите email, и мы отправим код для сброса
    </p>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
    <div id="successBox" class="alert alert-success d-none" role="alert"></div>

    <!-- ШАГ 1: Ввод email -->
    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control form-control-lg" id="forgotEmail" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 btn-lg" id="sendCodeBtn">Отправить код</button>
    </form>

    <!-- ШАГ 2: Ввод кода и нового пароля (скрыт изначально) -->
    <form id="resetForm" class="d-none mt-3">
      <div class="mb-3">
        <label class="form-label fw-semibold">Код из письма</label>
        <input type="text" class="form-control form-control-lg text-center" id="resetCode" placeholder="000000" maxlength="6" style="font-size: 24px; letter-spacing: 6px; font-weight: 700;" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Новый пароль</label>
        <input type="password" class="form-control form-control-lg" id="resetPassword" placeholder="Минимум 6 символов" minlength="6" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Подтверждение пароля</label>
        <input type="password" class="form-control form-control-lg" id="resetPasswordConfirm" placeholder="Повторите пароль" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 btn-lg" id="resetBtn">Сбросить пароль</button>
    </form>

    <div class="text-center mt-3">
      <p class="text-muted" style="font-size: 0.85rem;">
        <a href="index.html" style="color: var(--brand); text-decoration: none;">← Вернуться ко входу</a>
      </p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
